name: CI

# Runs on every push and every pull request, so a red suite blocks the
# merge instead of being discovered later.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # CI supplies its own throwaway config. SECRET_KEY has no default in
      # settings.py by design, so it must be set here or startup fails.
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Check for missing migrations
        # Fails if a model changed without makemigrations being run.
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Tests with coverage
        # coverage report exits non-zero below fail_under in pyproject.toml.
        run: |
          coverage run manage.py test
          coverage report

  deploy-checks:
    # Kept separate so a production-config warning is visible on its own
    # rather than buried in the test job.
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: example.com

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production readiness audit
        # Currently expected to report warnings; see BUILD_LOG known issues.
        # continue-on-error keeps it advisory until phase 7 fixes them, at
        # which point this flag should be removed so it becomes a gate.
        continue-on-error: true
        run: python manage.py check --deploy
