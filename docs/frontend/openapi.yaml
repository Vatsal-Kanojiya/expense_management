openapi: 3.0.3
info:
  title: Expense Tracker API
  version: 1.0.0
  description: 'Personal expenses, bills split between people, balances and settling
    up, CSV exports and bill scanning. Authenticate with `POST /api/v1/auth/login/`
    and send `Authorization: Bearer <access>`.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Username and password in, a token pair out.

        Throttled with the web login's own limiter and key, so attempts made
        through the page and through the API count against one budget --
        alternating between them buys an attacker nothing.
      summary: Log in
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Wrong username or password.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Right password, email not yet verified.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many attempts.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Revoke one refresh token: this device is signed out, others are
        not.'
      summary: Log out
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change the password, sign out every other device, keep this one.
      summary: Change password
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many wrong passwords.
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Mail a reset link. The answer is the same whether or not the email
        exists.
      summary: Request a password reset
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Set a new password from a mailed reset link.
      summary: Set a new password from a reset link
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Exchange a refresh token for a new pair. The old refresh token
        dies.
      summary: Refresh tokens
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Register. The account stays inactive until the mailed link is used.
      summary: Sign up
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many sign-ups.
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Activate an account from the mailed link, and sign it in.
      summary: Verify email
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/balances/:
    get:
      operationId: balances_retrieve
      description: All time unless `start`/`end` narrow it, because settling always
        settles the all-time amount (DECISIONS D46). Expenses whose lines do not add
        up are left out.
      summary: Who owes whom
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: To (YYYY-MM-DD). Defaults to all time.
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: From (YYYY-MM-DD). Defaults to all time.
      tags:
      - Balances
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'
          description: ''
        '400':
          description: Invalid dates.
  /api/v1/balances/{participant_id}/settle/:
    post:
      operationId: balances_settle_create
      description: 'Records a settlement for the whole outstanding amount, in whichever
        direction it runs: positive when they paid you back, negative when you paid
        them. Safe to retry: a second call finds nothing outstanding.'
      summary: Settle up with a person
      parameters:
      - in: path
        name: participant_id
        schema:
          type: integer
        required: true
      tags:
      - Balances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SettleRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SettleRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'
          description: Nothing was outstanding.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such person.
  /api/v1/bill-scans/:
    get:
      operationId: bill_scans_list
      description: |-
        Photograph a bill; a vision model reads it; a person confirms it.

        Nothing here creates an expense. The model's reading only ever becomes
        a draft (``prefill``) that the client shows for correction, and an
        expense exists only when the person saves it with ``POST expenses/``.
      summary: List your scanned bills, newest first
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Bill scans
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillScanList'
          description: ''
    post:
      operationId: bill_scans_create
      description: Multipart upload. Answers at once with the scan, status `pending`;
        poll it until `done` (then fetch `prefill/`) or `failed` (see `error`).
      summary: Upload a bill photo to scan
      tags:
      - Bill scans
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillScanUploadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillScan'
          description: ''
        '400':
          description: Not a usable photo.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/bill-scans/{id}/:
    get:
      operationId: bill_scans_retrieve
      description: |-
        Photograph a bill; a vision model reads it; a person confirms it.

        Nothing here creates an expense. The model's reading only ever becomes
        a draft (``prefill``) that the client shows for correction, and an
        expense exists only when the person saves it with ``POST expenses/``.
      summary: Get a scan's status and result
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bill scan.
        required: true
      tags:
      - Bill scans
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillScan'
          description: ''
  /api/v1/bill-scans/{id}/image/:
    get:
      operationId: bill_scans_image_retrieve
      description: |-
        Photograph a bill; a vision model reads it; a person confirms it.

        Nothing here creates an expense. The model's reading only ever becomes
        a draft (``prefill``) that the client shows for correction, and an
        expense exists only when the person saves it with ``POST expenses/``.
      summary: The uploaded photo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bill scan.
        required: true
      tags:
      - Bill scans
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/bill-scans/{id}/prefill/:
    get:
      operationId: bill_scans_prefill_retrieve
      description: Only for a finished scan that has not been saved yet. Show it for
        correction, then `POST expenses/` with the corrected fields and this `bill_scan`
        id.
      summary: The scan as a draft expense
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bill scan.
        required: true
      tags:
      - Bill scans
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePrefill'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Still scanning (`not_ready`), `failed`, or `already_saved`.
  /api/v1/categories/:
    get:
      operationId: categories_list
      description: |-
        Answer a create or update with the same annotated row a GET returns.

        The counts and totals come from annotations on get_queryset(), which a
        freshly saved instance does not carry. Re-reading it through the queryset
        means a client never sees a field that is there on GET and missing on
        POST.
      summary: List categories, with usage
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      description: |-
        Answer a create or update with the same annotated row a GET returns.

        The counts and totals come from annotations on get_queryset(), which a
        freshly saved instance does not carry. Re-reading it through the queryset
        means a client never sees a field that is there on GET and missing on
        POST.
      summary: Create a category
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: |-
        Answer a create or update with the same annotated row a GET returns.

        The counts and totals come from annotations on get_queryset(), which a
        freshly saved instance does not carry. Re-reading it through the queryset
        means a client never sees a field that is there on GET and missing on
        POST.
      summary: Get a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      description: |-
        Answer a create or update with the same annotated row a GET returns.

        The counts and totals come from annotations on get_queryset(), which a
        freshly saved instance does not carry. Re-reading it through the queryset
        means a client never sees a field that is there on GET and missing on
        POST.
      summary: Rename a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        Answer a create or update with the same annotated row a GET returns.

        The counts and totals come from annotations on get_queryset(), which a
        freshly saved instance does not carry. Re-reading it through the queryset
        means a client never sees a field that is there on GET and missing on
        POST.
      summary: Rename a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: |-
        Answer a create or update with the same annotated row a GET returns.

        The counts and totals come from annotations on get_queryset(), which a
        freshly saved instance does not carry. Re-reading it through the queryset
        means a client never sees a field that is there on GET and missing on
        POST.
      summary: Delete a category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: It still has expenses.
  /api/v1/expenses/:
    get:
      operationId: expenses_list
      description: All time unless `start`/`end` narrow it. `count` and `total_amount`
        cover the whole filtered set, not just this page. Follow `next` for more.
      summary: List expenses, newest date first
      parameters:
      - in: query
        name: category
        schema:
          type: integer
        description: A category id.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: On or before (YYYY-MM-DD).
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100, default 25.
      - in: query
        name: search
        schema:
          type: string
        description: Matches the note, line items and people.
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: On or after (YYYY-MM-DD).
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExpensePageList'
          description: ''
    post:
      operationId: expenses_create
      description: |-
        Scope every queryset to the requester, and stamp ownership on create.

        The direct analogue of OwnerScopedMixin and OwnerFormMixin. `user` is
        never a writable field, so ownership cannot be reassigned by a payload.
      summary: Create an expense
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
  /api/v1/expenses/{id}/:
    get:
      operationId: expenses_retrieve
      description: |-
        Scope every queryset to the requester, and stamp ownership on create.

        The direct analogue of OwnerScopedMixin and OwnerFormMixin. `user` is
        never a writable field, so ownership cannot be reassigned by a payload.
      summary: Get an expense
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    put:
      operationId: expenses_update
      description: |-
        Scope every queryset to the requester, and stamp ownership on create.

        The direct analogue of OwnerScopedMixin and OwnerFormMixin. `user` is
        never a writable field, so ownership cannot be reassigned by a payload.
      summary: Replace an expense
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    patch:
      operationId: expenses_partial_update
      description: |-
        Scope every queryset to the requester, and stamp ownership on create.

        The direct analogue of OwnerScopedMixin and OwnerFormMixin. `user` is
        never a writable field, so ownership cannot be reassigned by a payload.
      summary: Change part of an expense
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExpenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExpenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExpenseRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: ''
    delete:
      operationId: expenses_destroy
      description: |-
        Scope every queryset to the requester, and stamp ownership on create.

        The direct analogue of OwnerScopedMixin and OwnerFormMixin. `user` is
        never a writable field, so ownership cannot be reassigned by a payload.
      summary: Delete an expense
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this expense.
        required: true
      tags:
      - expenses
      security:
