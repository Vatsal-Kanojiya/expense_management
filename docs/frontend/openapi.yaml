components:
  schemas:
    Balance:
      type: object
      properties:
        participant:
          $ref: '#/components/schemas/Person'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - amount
      - participant
    Balances:
      type: object
      properties:
        start:
          type: string
          format: date
          nullable: true
        end:
          type: string
          format: date
          nullable: true
        owes_you:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: Still owed to you, after repayments.
        you_owe:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: Still owed by you, as positive amounts.
        owes_you_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        you_owe_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        gross:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
          description: 'Before repayments. Positive: they owe you. Negative: you owe
            them.'
      required:
      - end
      - gross
      - owes_you
      - owes_you_total
      - start
      - you_owe
      - you_owe_total
    Biggest:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        spent_on:
          type: string
          format: date
        note:
          type: string
        category_name:
          type: string
      required:
      - amount
      - category_name
      - id
      - note
      - spent_on
    BillScan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BillScanStatusEnum'
          readOnly: true
        provider:
          type: string
          readOnly: true
        error:
          type: string
          readOnly: true
        result:
          readOnly: true
        expense:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        image_url:
          type: string
          readOnly: true
      required:
      - completed_at
      - created_at
      - error
      - expense
      - id
      - image_url
      - provider
      - result
      - status
    BillScanStatusEnum:
      enum:
      - pending
      - running
      - done
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `done` - Done
        * `failed` - Failed
    BillScanUploadRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: A JPEG, PNG or WebP photo, at most 5 MB.
      required:
      - image
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        expense_count:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        last_spent_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
      required:
      - created_at
      - expense_count
      - id
      - last_amount
      - last_spent_on
      - name
      - total
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - name
    CategoryTotal:
      type: object
      properties:
        category:
          type: integer
        category_name:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        count:
          type: integer
        share:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Percentage of the period total.
      required:
      - category
      - category_name
      - count
      - share
      - total
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        spent_on:
          type: string
          format: date
        note:
          type: string
          maxLength: 255
        paid_by:
          type: integer
          nullable: true
        paid_by_name:
          type: string
          readOnly: true
          nullable: true
        participants:
          type: array
          items:
            type: integer
        misc_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        misc_note:
          type: string
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        items_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        unaccounted_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          readOnly: true
        is_balanced:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - category_name
      - created_at
      - id
      - is_balanced
      - items_total
      - paid_by_name
      - spent_on
      - unaccounted_amount
    ExpenseItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        shares:
          type: array
          items:
            $ref: '#/components/schemas/ItemShare'
      required:
      - amount
      - id
      - name
    ExpenseItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        shares:
          type: array
          items:
            $ref: '#/components/schemas/ItemShareRequest'
      required:
      - amount
      - name
    ExpensePage:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        count:
          type: integer
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        results:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
      required:
      - count
      - next
      - previous
      - results
      - total_amount
    ExpensePrefill:
      type: object
      description: What the model read, shaped as an expense to show, correct and
        POST.
      properties:
        bill_scan:
          type: integer
          description: Send back unchanged with the expense.
        category:
          type: integer
          nullable: true
          description: Only when the scan's guess matches one of your categories.
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        spent_on:
          type: string
          format: date
        note:
          type: string
        misc_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        misc_note:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrefillItem'
      required:
      - amount
      - bill_scan
      - category
      - items
      - misc_amount
      - misc_note
      - note
      - spent_on
    ExpenseRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        spent_on:
          type: string
          format: date
        note:
          type: string
          maxLength: 255
        paid_by:
          type: integer
          nullable: true
        participants:
          type: array
          items:
            type: integer
        misc_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        misc_note:
          type: string
          maxLength: 100
        include_self:
          type: boolean
          writeOnly: true
          default: true
        bill_scan:
          type: integer
          writeOnly: true
          nullable: true
          description: 'On create only: the scan this expense was confirmed from.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItemRequest'
      required:
      - amount
      - category
      - spent_on
    ExpenseSplit:
      type: object
      properties:
        expense:
          type: integer
        is_balanced:
          type: boolean
        unaccounted_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SplitRow'
        items_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        misc_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - expense
      - grand_total
      - is_balanced
      - items_total
      - misc_total
      - rows
      - unaccounted_amount
    ExportJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ExportJobStatusEnum'
          readOnly: true
        start:
          type: string
          format: date
          readOnly: true
        end:
          type: string
          format: date
          readOnly: true
        row_count:
          type: integer
          readOnly: true
        error:
          type: string
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        download_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - completed_at
      - download_url
      - end
      - error
      - id
      - requested_at
      - row_count
      - start
      - status
    ExportJobStatusEnum:
      enum:
      - pending
      - running
      - complete
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `complete` - Complete
        * `failed` - Failed
    ExportRequestRequest:
      type: object
      properties:
        start:
          type: string
          format: date
          description: Defaults to the 1st of this month.
        end:
          type: string
          format: date
          description: Defaults to the end of this month.
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HealthDown:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ItemShare:
      type: object
      properties:
        participant:
          type: integer
        weight:
          type: integer
          maximum: 32767
          minimum: 1
      required:
      - participant
    ItemShareRequest:
      type: object
      properties:
        participant:
          type: integer
        weight:
          type: integer
          maximum: 32767
          minimum: 1
      required:
      - participant
    LinkRequest:
      type: object
      description: 'The two halves of a mailed link: ``/verify-email/<uid>/<token>``.'
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    Me:
      type: object
      description: |-
        The signed-in user, and the participant that stands for them in splits.

        ``self_participant.id`` is what a client sends as ``paid_by`` for "I
        paid" and lists among ``participants`` for "I was there".
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Used to sign in to support and to reset your password.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        self_participant:
          allOf:
          - $ref: '#/components/schemas/SelfParticipant'
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_staff
      - last_login
      - self_participant
      - username
    Message:
      type: object
      description: |-
        A plain answer: what happened, and a stable code a client can branch on.

        ``detail`` is for people and may be reworded; ``code`` is for programs
        and will not change. Error responses from DRF itself use the same
        ``detail`` key, so a client reads one field for both.
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - detail
    PaginatedBillScanList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/BillScan'
    PaginatedCategoryList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedExpensePageList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExpensePage'
    PaginatedExportJobList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExportJob'
    PaginatedParticipantList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
    PaginatedSettlementList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
    Participant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 60
        is_self:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        shared_count:
          type: integer
          readOnly: true
        item_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - is_self
      - item_count
      - name
      - shared_count
    ParticipantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - name
    PasswordChangeRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
        new_password_confirm:
          type: string
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    PasswordResetConfirmRequest:
      type: object
      description: 'The two halves of a mailed link: ``/verify-email/<uid>/<token>``.'
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
        new_password_confirm:
          type: string
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    PatchedExpenseRequest:
      type: object
      properties:
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        spent_on:
          type: string
          format: date
        note:
          type: string
          maxLength: 255
        paid_by:
          type: integer
          nullable: true
        participants:
          type: array
          items:
            type: integer
        misc_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        misc_note:
          type: string
          maxLength: 100
        include_self:
          type: boolean
          writeOnly: true
          default: true
        bill_scan:
          type: integer
          writeOnly: true
          nullable: true
          description: 'On create only: the scan this expense was confirmed from.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItemRequest'
    PatchedMeRequest:
      type: object
      description: |-
        The signed-in user, and the participant that stands for them in splits.

        ``self_participant.id`` is what a client sends as ``paid_by`` for "I
        paid" and lists among ``participants`` for "I was there".
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    PatchedParticipantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    Period:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        count:
          type: integer
      required:
      - count
      - end
      - start
      - total
    Person:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    PrefillItem:
      type: object
      properties:
        name:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - amount
      - name
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    SelfParticipant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    SettleRequestRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 255
    SettleResponse:
      type: object
      description: |-
        A plain answer: what happened, and a stable code a client can branch on.

        ``detail`` is for people and may be reworded; ``code`` is for programs
        and will not change. Error responses from DRF itself use the same
        ``detail`` key, so a client reads one field for both.
      properties:
        detail:
          type: string
        code:
          type: string
        settlement:
          allOf:
          - $ref: '#/components/schemas/Settlement'
          nullable: true
      required:
      - detail
      - settlement
    Settlement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        participant:
          type: integer
          readOnly: true
        participant_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        note:
          type: string
          readOnly: true
        settled_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - id
      - note
      - participant
      - participant_name
      - settled_at
    SignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        password_confirm:
          type: string
          minLength: 1
      required:
      - email
      - password
      - password_confirm
      - username
    SplitPerson:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_self:
          type: boolean
      required:
      - id
      - is_self
      - name
    SplitRow:
      type: object
      properties:
        participant:
          $ref: '#/components/schemas/SplitPerson'
        items:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Their share of the lines or even split.
        misc:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Their share of tax, tip and the like.
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - items
      - misc
      - participant
      - total
    Summary:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        count:
          type: integer
        average:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        biggest:
          allOf:
          - $ref: '#/components/schemas/Biggest'
          nullable: true
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotal'
        previous:
          allOf:
          - $ref: '#/components/schemas/Period'
          description: The previous calendar month for a whole month, else the equally
            long window just before.
        change_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Null when the previous period had no spending.
      required:
      - average
      - biggest
      - by_category
      - change_percent
      - count
      - end
      - previous
      - start
      - total
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: 'Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: Exchange at `auth/refresh/` for a new pair.
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    ValidationError:
      type: object
      description: |-
        DRF's 400 shape: each invalid field maps to a list of messages.

        Errors that belong to no single field are under ``non_field_errors``.
        Declared with one example field only because the keys depend on the
        request; the schema cannot list them all.
      properties:
        non_field_errors:
          type: array
          items:
            type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
