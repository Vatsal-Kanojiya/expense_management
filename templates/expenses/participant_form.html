{% extends "base.html" %}
{% block title %}
  {% if form.instance.pk %}Edit person{% else %}Add someone{% endif %} · Expense Tracker
{% endblock %}

{% block content %}
  <h1>{% if form.instance.pk %}Edit person{% else %}Add someone{% endif %}</h1>

  <div class="card">
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="{% url 'expenses:participant_list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
